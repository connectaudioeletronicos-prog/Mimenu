<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Palatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #146c43;
    --verde-escura: #0e5535;
    --verde-clara: #e5f3ec;
    --texto: #1b1f1d;
    --texto-claro: #6f7975;
    --borda: #dbe2de;
    --fundo-suave: #f6f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--fundo-suave);
    color: var(--texto);
    margin: 0;
    text-align: left;
  }
  .cabecalho {
    background: var(--verde-escura); color: white; padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .cabecalho .menu-icone {
    width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.12);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cabecalho h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .cabecalho .tagline-topo { font-size: 11px; opacity: 0.8; margin-top: 1px; }
  .menu-dropdown {
    position: absolute; top: 62px; left: 20px; background: white;
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    min-width: 190px; display: none; flex-direction: column;
    overflow: hidden; z-index: 50;
  }
  .menu-dropdown.aberto { display: flex; }
  .menu-dropdown a {
    padding: 13px 16px; color: var(--texto); text-decoration: none;
    font-size: 14.5px; border-bottom: 1px solid var(--borda);
  }
  .menu-dropdown a:last-child { border-bottom: none; }
  .menu-dropdown a:hover { background: var(--fundo-suave); }

  .pagina { max-width: 720px; margin: 0 auto; padding: 28px 20px 40px; text-align: left; }
  @media (min-width: 900px) { .pagina { max-width: 900px; padding: 40px 20px 50px; } }

  .voltar { display: inline-block; margin-bottom: 16px; color: var(--verde-escura); text-decoration: none; font-size: 14px; font-weight: 500; }

  h2.titulo-pagina { font-size: 28px; margin: 0 0 18px; color: var(--verde-escura); font-weight: 800; }
  .capa { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; display: block; }
  .texto-pagina { font-size: 15.5px; line-height: 1.75; }
  .texto-pagina p { margin: 0 0 16px; text-align: left !important; }
  .texto-pagina h3 { font-size: 19px; color: var(--verde-escura); margin: 26px 0 8px; font-weight: 700; text-align: left !important; }
  .texto-pagina ul { margin: 0 0 16px; padding-left: 22px; text-align: left !important; }
  .texto-pagina li { margin-bottom: 6px; }
  .texto-pagina img.imagem-inline { width: 100%; border-radius: 12px; margin: 20px 0; display: block; }

  .redes-sociais { display: flex; justify-content: center; gap: 14px; margin: 30px auto 0; max-width: 720px; padding: 0 20px; }
  @media (min-width: 900px) { .redes-sociais { max-width: 900px; } }
  .redes-sociais.oculto { display: none; }
  .redes-sociais a {
    width: 40px; height: 40px; border-radius: 50%; background: var(--verde-clara);
    display: flex; align-items: center; justify-content: center; color: var(--verde-escura);
    text-decoration: none;
  }

  .rodape {
    background: var(--verde-escura); color: white; margin-top: 30px;
    padding: 26px 20px; display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; gap: 12px;
  }
  .rodape .marca { font-weight: 800; font-size: 17px; }
  .rodape .slogan { font-size: 12.5px; opacity: 0.8; margin-top: 2px; }
  .rodape .links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  .rodape .links a { color: white; text-decoration: none; opacity: 0.9; }
  .rodape .links a:hover { text-decoration: underline; }

  .carregando, .erro-pagina { text-align: center; padding: 60px 20px; color: var(--texto-claro); }
</style>
</head>
<body>
  <div class="cabecalho">
    <button class="menu-icone" id="botaoMenu" onclick="alternarMenu()" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div>
      <h1 id="cabecalhoTitulo">Nosso Blog</h1>
      <div class="tagline-topo" id="cabecalhoTagline">Dicas, novidades e muito mais!</div>
    </div>
    <div class="menu-dropdown" id="menuDropdown">
      <a href="/blog">Página principal</a>
      <a href="/blog/sobre-nos">Sobre nós</a>
      <a href="/blog/contato">Contato</a>
      <a href="/politica-privacidade.html">Política de Privacidade</a>
      <a href="/termos-servico.html">Termos de Uso</a>
    </div>
  </div>

  <div class="pagina">
    <a class="voltar" href="/blog">← Voltar para o blog</a>
    <div id="conteudoPagina" class="carregando">Carregando...</div>
  </div>

  <div class="redes-sociais oculto" id="redesSociais"></div>

  <div class="rodape">
    <div>
      <div class="marca">Palatos</div>
      <div class="slogan">Mais praticidade no seu dia a dia.</div>
    </div>
    <div class="links">
      <a href="/">Início</a>
      <a href="/blog/sobre-nos">Sobre nós</a>
      <a href="/blog/contato">Contato</a>
      <a href="/termos-servico.html">Termos de Uso</a>
      <a href="/politica-privacidade.html">Política de Privacidade</a>
    </div>
  </div>

<script src="../js/config.js"></script>
<script>
function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

function alternarMenu() {
  document.getElementById('menuDropdown').classList.toggle('aberto');
}
document.addEventListener('click', (evento) => {
  const dropdown = document.getElementById('menuDropdown');
  const botao = document.getElementById('botaoMenu');
  if (dropdown.classList.contains('aberto') && !dropdown.contains(evento.target) && !botao.contains(evento.target)) {
    dropdown.classList.remove('aberto');
  }
});

async function carregarCabecalho() {
  try {
    const resposta = await fetch(API_BASE_URL + '/blog/configuracoes');
    const c = await resposta.json();
    if (c.cabecalho_titulo) document.getElementById('cabecalhoTitulo').textContent = c.cabecalho_titulo;
    if (c.cabecalho_tagline) document.getElementById('cabecalhoTagline').textContent = c.cabecalho_tagline;
  } catch (e) {
    // mantem "Nosso Blog" padrao se nao conseguir carregar
  }
}
carregarCabecalho();

function renderizarConteudo(texto) {
  const blocos = (texto || '').split(/\n\s*\n/);
  return blocos.map(bloco => {
    const linha = bloco.trim();
    if (!linha) return '';
    if (linha.startsWith('## ')) {
      return `<h3>${formatarInline(linha.slice(3).trim())}</h3>`;
    }
    const imagem = linha.match(/^!\[([^\]]*)\]\((\S+)\)$/);
    if (imagem) {
      return `<img class="imagem-inline" src="${escaparHtml(imagem[2])}" alt="${escaparHtml(imagem[1])}">`;
    }
    const linhasDoBloco = linha.split('\n').map(l => l.trim()).filter(Boolean);
    if (linhasDoBloco.length > 0 && linhasDoBloco.every(l => l.startsWith('- '))) {
      const itens = linhasDoBloco.map(l => `<li>${formatarInline(l.slice(2).trim())}</li>`).join('');
      return `<ul>${itens}</ul>`;
    }
    return `<p>${formatarInline(linha).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function formatarInline(texto) {
  return escaparHtml(texto).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function iconeRedeSocial(nome) {
  const icones = {
    facebook: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>',
    instagram: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
    youtube: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.6-.5-5.3c-.3-1-1-1.7-2-2C18.8 4.2 12 4.2 12 4.2s-6.8 0-8.5.5c-1 .3-1.7 1-2 2C1 8.4 1 12 1 12s0 3.6.5 5.3c.3 1 1 1.7 2 2 1.7.5 8.5.5 8.5.5s6.8 0 8.5-.5c1-.3 1.7-1 2-2 .5-1.7.5-5.3.5-5.3ZM10 15.5v-7l6 3.5-6 3.5Z"/></svg>',
    tiktok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.5a2.5 2.5 0 1 1-2.5-2.5c.17 0 .34.01.5.04V9.9a5.6 5.6 0 0 0-.5-.02A5.6 5.6 0 1 0 16.5 15V8.3a7.7 7.7 0 0 0 4.5 1.4V6.7a4.7 4.7 0 0 1-4.5-4.7Z"/></svg>'
  };
  return icones[nome] || '';
}

async function carregarRedesSociais() {
  try {
    const resposta = await fetch(API_BASE_URL + '/blog/configuracoes');
    const config = await resposta.json();
    const redes = ['facebook', 'instagram', 'youtube', 'tiktok'].filter(nome => config[nome]);
    if (redes.length === 0) return;
    const div = document.getElementById('redesSociais');
    div.innerHTML = redes.map(nome => `
      <a href="${escaparHtml(config[nome])}" title="${nome}" aria-label="${nome}" target="_blank" rel="noopener">${iconeRedeSocial(nome)}</a>
    `).join('');
    div.classList.remove('oculto');
  } catch (e) {
    // sem redes sociais configuradas -- so nao mostra a fileira
  }
}

async function carregarPagina() {
  const div = document.getElementById('conteudoPagina');
  const tipo = new URLSearchParams(window.location.search).get('tipo');

  if (tipo !== 'sobre-nos' && tipo !== 'contato') {
    div.innerHTML = '<div class="erro-pagina">Página não encontrada.</div>';
    return;
  }

  try {
    const resposta = await fetch(API_BASE_URL + '/blog/paginas/' + tipo);
    const pagina = await resposta.json();
    if (!resposta.ok) {
      const rotulo = tipo === 'sobre-nos' ? 'Sobre nós' : 'Contato';
      div.innerHTML = `<div class="erro-pagina">A página "${rotulo}" ainda não foi preenchida.</div>`;
      return;
    }
    document.title = pagina.titulo + ' - Blog Palatos';
    div.innerHTML = `
      <h2 class="titulo-pagina">${escaparHtml(pagina.titulo)}</h2>
      ${pagina.imagem_url ? `<img class="capa" src="${pagina.imagem_url}" alt="">` : ''}
      <div class="texto-pagina">${renderizarConteudo(pagina.conteudo)}</div>
    `;
  } catch (e) {
    div.innerHTML = '<div class="erro-pagina">Não foi possível conectar. Verifique sua internet.</div>';
  }
}

carregarPagina();
carregarRedesSociais();
</script>
</body>
</html>
