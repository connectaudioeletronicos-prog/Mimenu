<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte - Mimenu</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 16px; color: #222; }
  .card { background: white; padding: 20px; border-radius: 12px; max-width: 640px; margin: 0 auto 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; color: #1D3557; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; font-size: 14px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-family: inherit; }
  button { margin-top: 16px; padding: 11px 16px; background: #1D3557; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button.secundario { background: #6c757d; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 14px; }
  .erro { background: #fde2e2; color: #b00; }
  .ok { background: #e2fde2; color: #060; }
  .oculto { display: none; }
  .topo { display:flex; justify-content: space-between; align-items:center; }
  .topo button { margin-top: 0; }
  .ticket-card { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .ticket-card:hover { background: #fafafa; }
  .ticket-card__topo { display: flex; justify-content: space-between; align-items: center; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 12px; }
  .badge-novo { background: #fde2e2; color: #b00; }
  .badge-aberto { background: #fff3cd; color: #856404; }
  .badge-respondido { background: #d4edda; color: #155724; }
  .thread { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 10px; background: #f7f7f7; border-radius: 8px; margin-bottom: 12px; }
  .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .msg-bubble--admin { align-self: flex-end; background: #dff5ea; }
  .msg-bubble--lojista { align-self: flex-start; background: #fff; }
  .msg-bubble__autor { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 4px; }
  .msg-bubble__texto { white-space: pre-wrap; word-break: break-word; }
  .msg-bubble__anexo { max-width: 200px; border-radius: 6px; margin-top: 6px; display: block; }
  .msg-bubble__data { font-size: 10px; color: #999; margin-top: 6px; text-align: right; }
</style>
</head>
<body>

  <!-- TELA DE LOGIN COM CHAVE MESTRA -->
  <div class="card" id="tela-login">
    <h1>Suporte</h1>
    <p class="sub">Área restrita — só você tem acesso.</p>
    <label>Chave mestra</label>
    <input type="password" id="inputChaveMestra" placeholder="Sua CHAVE_CADASTRO_ADMIN">
    <button onclick="entrar()">Entrar</button>
    <div id="msgLogin"></div>
  </div>

  <!-- LISTA DE TICKETS -->
  <div id="view-lista" class="oculto">
    <div class="card">
      <div class="topo">
        <div>
          <h1 style="margin:0">Suporte</h1>
          <p class="sub">Chamados abertos pelos lojistas.</p>
        </div>
        <div>
          <button class="secundario" onclick="window.location.href='painel-superadmin.html'">← Painel</button>
          <button class="secundario" onclick="carregarTickets()">Atualizar</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div id="listaTickets">Carregando...</div>
    </div>
  </div>

  <!-- DETALHE DO TICKET -->
  <div id="view-detalhe" class="oculto">
    <div class="card">
      <div class="topo">
        <h2 id="detalheAssunto" style="margin:0"></h2>
        <button class="secundario" onclick="voltarParaLista()">← Voltar</button>
      </div>
      <p class="sub" id="detalheLoja"></p>
      <div class="thread" id="detalheThread"></div>
      <label>Responder</label>
      <textarea id="detalheResposta" rows="4" placeholder="Escreva sua resposta..."></textarea>
      <button onclick="enviarResposta()" id="btnEnviarResposta">Enviar resposta</button>
      <div id="detalheResultado"></div>
    </div>
  </div>

<script src="../js/config.js"></script>
<script>
let CHAVE_MESTRA = '';
let TICKET_ATUAL = null;

function entrar() {
  const chave = document.getElementById('inputChaveMestra').value.trim();
  const msgDiv = document.getElementById('msgLogin');
  if (!chave) {
    msgDiv.innerHTML = '<div class="msg erro">Informe a chave mestra.</div>';
    return;
  }
  CHAVE_MESTRA = chave;
  sessionStorage.setItem('chaveMestraPainel', chave);
  document.getElementById('tela-login').classList.add('oculto');
  document.getElementById('view-lista').classList.remove('oculto');
  carregarTickets();
}

window.addEventListener('DOMContentLoaded', () => {
  const salva = sessionStorage.getItem('chaveMestraPainel');
  if (salva) {
    document.getElementById('inputChaveMestra').value = salva;
    entrar();
  }
});

function formatarData(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function rotuloStatus(t) {
  if (t.nao_lido_pelo_admin) return '<span class="badge badge-novo">Nova mensagem</span>';
  if (t.status === 'respondido') return '<span class="badge badge-respondido">Respondido</span>';
  return '<span class="badge badge-aberto">Aguardando</span>';
}

async function carregarTickets() {
  const div = document.getElementById('listaTickets');
  div.innerHTML = 'Carregando...';
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/suporte/tickets?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA));
    const dados = await resposta.json();
    if (!resposta.ok) {
      div.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao carregar.') + '</div>';
      return;
    }
    if (dados.length === 0) {
      div.innerHTML = '<p class="sub">Nenhum chamado de suporte ainda.</p>';
      return;
    }
    div.innerHTML = dados.map(t => `
      <div class="ticket-card" onclick="abrirTicket('${t.id}')">
        <div class="ticket-card__topo">
          <strong>${t.nome_loja}</strong>
          ${rotuloStatus(t)}
        </div>
        <div>${t.assunto}</div>
        <p class="sub" style="margin:4px 0;">${(t.ultima_mensagem || '').slice(0, 100)}</p>
        <small class="sub">${formatarData(t.atualizado_em)}</small>
      </div>
    `).join('');
  } catch (e) {
    div.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
}

function renderizarBolha(m) {
  const ehAdmin = m.autor === 'admin';
  return `
    <div class="msg-bubble ${ehAdmin ? 'msg-bubble--admin' : 'msg-bubble--lojista'}">
      <div class="msg-bubble__autor">${ehAdmin ? 'Você (suporte)' : 'Lojista'}</div>
      <div class="msg-bubble__texto">${(m.mensagem || '').replace(/</g, '&lt;')}</div>
      ${m.anexo_url ? `<a href="${m.anexo_url}" target="_blank"><img src="${m.anexo_url}" class="msg-bubble__anexo"></a>` : ''}
      <div class="msg-bubble__data">${formatarData(m.criado_em)}</div>
    </div>
  `;
}

async function abrirTicket(id) {
  document.getElementById('view-lista').classList.add('oculto');
  document.getElementById('view-detalhe').classList.remove('oculto');
  document.getElementById('detalheThread').innerHTML = 'Carregando...';
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/suporte/tickets/' + id + '?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA));
    const dados = await resposta.json();
    if (!resposta.ok) {
      document.getElementById('detalheThread').innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao carregar.') + '</div>';
      return;
    }
    TICKET_ATUAL = id;
    document.getElementById('detalheAssunto').textContent = dados.ticket.assunto;
    document.getElementById('detalheLoja').textContent = dados.ticket.nome_loja + ' · ' + dados.ticket.email_loja;
    document.getElementById('detalheThread').innerHTML = dados.mensagens.map(renderizarBolha).join('');
    document.getElementById('detalheResposta').value = '';
    document.getElementById('detalheResultado').innerHTML = '';
  } catch (e) {
    document.getElementById('detalheThread').innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
}

function voltarParaLista() {
  document.getElementById('view-detalhe').classList.add('oculto');
  document.getElementById('view-lista').classList.remove('oculto');
  carregarTickets();
}

async function enviarResposta() {
  const mensagem = document.getElementById('detalheResposta').value.trim();
  const resultadoDiv = document.getElementById('detalheResultado');
  const botao = document.getElementById('btnEnviarResposta');
  resultadoDiv.innerHTML = '';

  if (!mensagem) {
    resultadoDiv.innerHTML = '<div class="msg erro">Escreva uma mensagem.</div>';
    return;
  }
  if (!TICKET_ATUAL) return;

  botao.disabled = true;
  botao.textContent = 'Enviando...';
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/suporte/tickets/' + TICKET_ATUAL + '/mensagens', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chaveMestra: CHAVE_MESTRA, mensagem })
    });
    const dados = await resposta.json();
    if (!resposta.ok) {
      resultadoDiv.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao enviar.') + '</div>';
    } else {
      resultadoDiv.innerHTML = '<div class="msg ok">Resposta enviada' + (dados.email_notificacao_enviado ? ' e o lojista foi avisado por e-mail.' : ', mas o e-mail de aviso falhou (o lojista ainda ve a resposta no painel).') + '</div>';
      abrirTicket(TICKET_ATUAL);
    }
  } catch (e) {
    resultadoDiv.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
  botao.disabled = false;
  botao.textContent = 'Enviar resposta';
}
</script>
</body>
</html>
