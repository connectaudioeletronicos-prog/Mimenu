<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Administrador - Mimenu</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 16px; color: #222; }
  .card { background: white; padding: 20px; border-radius: 12px; max-width: 640px; margin: 0 auto 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; color: #1D3557; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; font-size: 14px; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  button { margin-top: 16px; padding: 11px 16px; background: #1D3557; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button.secundario { background: #6c757d; }
  button.perigo { background: #b00020; }
  button.sucesso { background: #2A9D8F; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 14px; }
  .erro { background: #fde2e2; color: #b00; }
  .ok { background: #e2fde2; color: #060; }
  .oculto { display: none; }
  img.qrcode { width: 180px; height: 180px; display: block; margin: 12px auto 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; vertical-align: middle; }
  th { color: #666; font-weight: normal; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 12px; }
  .badge-pendente { background: #fff3cd; color: #856404; }
  .badge-em_andamento { background: #cce5ff; color: #004085; }
  .badge-concluido { background: #d4edda; color: #155724; }
  .badge-expirado, .badge-cancelado { background: #eee; color: #888; }
  .badge-ativo { background: #d4edda; color: #155724; }
  .badge-bloqueado { background: #fde2e2; color: #b00; }
  .acoes-tabela button { margin: 2px 0 0; padding: 5px 8px; font-size: 12px; }
  .link-copiavel { font-size: 12px; word-break: break-all; color: #444; background: #f7f7f7; padding: 6px; border-radius: 6px; margin-top: 6px; }
  .topo { display:flex; justify-content: space-between; align-items:center; }
  .topo button { margin-top: 0; }
  .modal-fundo {
    position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-start; justify-content: center; z-index: 1000;
    overflow-y: auto; padding: 16px 0;
  }
  .modal-caixa { background: white; border-radius: 12px; max-width: 560px; width: 92%; padding: 20px; margin-top: 20px; }
  .modal-caixa h2 { display:flex; justify-content: space-between; align-items:center; }
  .modal-caixa h3 { font-size: 14px; color: #666; margin: 18px 0 6px; text-transform: uppercase; }
  .campo-2col { display: flex; gap: 10px; }
  .campo-2col > div { flex: 1; }
  .somente-leitura { background: #f0f0f0; color: #555; }
</style>
</head>
<body>

  <!-- TELA DE LOGIN COM CHAVE MESTRA -->
  <div class="card" id="tela-login">
    <h1>Painel do Administrador</h1>
    <p class="sub">Área restrita — só você tem acesso.</p>
    <label>Chave mestra</label>
    <input type="password" id="inputChaveMestra" placeholder="Sua CHAVE_CADASTRO_ADMIN">
    <button onclick="entrar()">Entrar</button>
    <div id="msgLogin"></div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="painel-principal" class="oculto">

    <div class="card">
      <div class="topo">
        <h1 style="margin:0">Painel do Administrador</h1>
        <div>
          <button class="secundario" onclick="window.location.href='comunicacao.html'">💬 Comunicação</button>
          <button class="secundario" onclick="window.location.href='suporte-tickets.html'">🆘 Suporte (chamados) <span id="badgeSuporteNaoLido" class="badge badge-pendente oculto"></span></button>
          <button class="secundario" onclick="sair()">Sair</button>
        </div>
      </div>
    </div>

    <!-- GERAR CONVITE -->
    <div class="card">
      <h2>Gerar link de cadastro para lojista</h2>
      <label>Observação (opcional)</label>
      <input type="text" id="observacao" placeholder="ex: Pizzaria do João - indicação Instagram">
      <label>Validade (dias)</label>
      <input type="number" id="dias" value="7" min="1" max="30">
      <button onclick="gerarConvite()" id="btnGerarConvite">Gerar link</button>
      <div id="resultadoConvite"></div>
    </div>

    <!-- LISTA DE CONVITES -->
    <div class="card">
      <div class="topo">
        <h2 style="margin:0">Convites gerados</h2>
        <button class="secundario" onclick="carregarConvites()">Atualizar</button>
      </div>
      <div id="listaConvites">Carregando...</div>
    </div>

    <!-- LISTA DE LOJISTAS -->
    <div class="card">
      <div class="topo">
        <h2 style="margin:0">Lojas cadastradas</h2>
        <button class="secundario" onclick="carregarLojistas()">Atualizar</button>
      </div>
      <div id="listaLojistas">Carregando...</div>
    </div>

  </div>

  <!-- MODAL DE DETALHE/EDICAO DA LOJA -->
  <div id="modalDetalheLoja" class="modal-fundo oculto" onclick="if (event.target === this) fecharDetalheLoja()">
    <div class="modal-caixa">
      <h2><span id="detalheLojaNome">Loja</span> <button class="secundario" onclick="fecharDetalheLoja()">Fechar</button></h2>
      <p class="sub" id="detalheLojaSlug"></p>

      <h3>Contato (visivel no cardapio)</h3>
      <label>E-mail de login</label>
      <input type="email" id="campoEmail">
      <div class="campo-2col">
        <div><label>WhatsApp</label><input type="text" id="campoWhatsapp"></div>
        <div><label>Telefone</label><input type="text" id="campoTelefone"></div>
      </div>
      <label>Endereço (texto livre do cardápio)</label>
      <input type="text" id="campoEndereco">

      <h3>Dados cadastrais (KYC)</h3>
      <div class="campo-2col">
        <div><label>Nome do responsável</label><input type="text" id="campoResponsavelNome" disabled class="somente-leitura"></div>
        <div><label>Telefone do responsável</label><input type="text" id="campoResponsavelTelefone"></div>
      </div>
      <div class="campo-2col">
        <div><label>CPF (mascarado - LGPD)</label><input type="text" id="campoCpf" disabled class="somente-leitura"></div>
        <div><label>CNPJ (mascarado - LGPD)</label><input type="text" id="campoCnpj" disabled class="somente-leitura"></div>
      </div>
      <label>Razão social / Nome fantasia</label>
      <input type="text" id="campoRazaoSocial" disabled class="somente-leitura">

      <h3>Endereço cadastral (KYC)</h3>
      <div class="campo-2col">
        <div><label>CEP</label><input type="text" id="campoCep"></div>
        <div><label>Número</label><input type="text" id="campoNumero"></div>
      </div>
      <label>Rua</label>
      <input type="text" id="campoRua">
      <div class="campo-2col">
        <div><label>Bairro</label><input type="text" id="campoBairro"></div>
        <div><label>Cidade</label><input type="text" id="campoCidade"></div>
      </div>
      <label>UF</label>
      <input type="text" id="campoUf" maxlength="2" style="max-width:80px;">

      <button onclick="salvarDetalheLoja()" id="btnSalvarDetalheLoja">Salvar alterações</button>
      <div id="resultadoDetalheLoja"></div>
    </div>
  </div>

<script src="../js/config.js"></script>
<script>
let CHAVE_MESTRA = '';
let LOJA_DETALHE_ATUAL = null;

function entrar() {
  const chave = document.getElementById('inputChaveMestra').value.trim();
  const msgDiv = document.getElementById('msgLogin');
  if (!chave) {
    msgDiv.innerHTML = '<div class="msg erro">Informe a chave mestra.</div>';
    return;
  }
  CHAVE_MESTRA = chave;
  sessionStorage.setItem('chaveMestraPainel', chave);
  document.getElementById('tela-login').classList.add('oculto');
  document.getElementById('painel-principal').classList.remove('oculto');
  carregarConvites();
  carregarLojistas();
  atualizarBadgeSuporte();
}

async function atualizarBadgeSuporte() {
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/suporte/tickets?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA), { cache: 'no-store' });
    const dados = await resposta.json();
    if (!resposta.ok) return;
    const naoLidos = dados.filter(t => t.nao_lido_pelo_admin).length;
    const badge = document.getElementById('badgeSuporteNaoLido');
    if (naoLidos > 0) {
      badge.textContent = naoLidos;
      badge.classList.remove('oculto');
    } else {
      badge.classList.add('oculto');
    }
  } catch (e) {
    // Silencioso -- badge e so um indicador visual, nao trava o painel.
  }
}

function sair() {
  CHAVE_MESTRA = '';
  sessionStorage.removeItem('chaveMestraPainel');
  document.getElementById('tela-login').classList.remove('oculto');
  document.getElementById('painel-principal').classList.add('oculto');
  document.getElementById('inputChaveMestra').value = '';
}

// Re-usa a chave se a pagina for recarregada na mesma aba/sessao
window.addEventListener('DOMContentLoaded', () => {
  const salva = sessionStorage.getItem('chaveMestraPainel');
  if (salva) {
    document.getElementById('inputChaveMestra').value = salva;
    entrar();
  }
});

async function gerarConvite() {
  const observacao = document.getElementById('observacao').value.trim();
  const dias = document.getElementById('dias').value;
  const resultadoDiv = document.getElementById('resultadoConvite');
  const botao = document.getElementById('btnGerarConvite');
  resultadoDiv.innerHTML = '';
  botao.disabled = true;
  botao.textContent = 'Gerando...';

  try {
    const resposta = await fetch(API_BASE_URL + '/convites/gerar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chaveMestra: CHAVE_MESTRA, observacao, diasValidade: Number(dias) })
    });
    const dados = await resposta.json();

    if (resposta.ok) {
      resultadoDiv.innerHTML = `
        <div class="msg ok">Link gerado! Válido até ${new Date(dados.expira_em).toLocaleString('pt-BR')}</div>
        <div class="link-copiavel">${dados.link}</div>
        <img class="qrcode" src="${dados.qrcode}" alt="QR Code">
        <button class="secundario" onclick="navigator.clipboard.writeText('${dados.link}').then(()=>alert('Link copiado!'))">Copiar link</button>
      `;
      document.getElementById('observacao').value = '';
      carregarConvites();
    } else {
      resultadoDiv.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao gerar convite.') + '</div>';
    }
  } catch (e) {
    resultadoDiv.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
  botao.disabled = false;
  botao.textContent = 'Gerar link';
}

async function carregarConvites() {
  const div = document.getElementById('listaConvites');
  div.innerHTML = 'Carregando...';
  try {
    const resposta = await fetch(API_BASE_URL + '/convites?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA));
    const dados = await resposta.json();
    if (!resposta.ok) {
      div.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao carregar.') + '</div>';
      return;
    }
    if (dados.length === 0) {
      div.innerHTML = '<p class="sub">Nenhum convite gerado ainda.</p>';
      return;
    }
    let html = '<table><tr><th>Observação</th><th>Status</th><th>Expira</th><th></th></tr>';
    dados.forEach(c => {
      const podeCancelar = c.status === 'pendente' || c.status === 'em_andamento';
      html += `<tr>
        <td>${c.observacao || '-'}</td>
        <td><span class="badge badge-${c.status}">${c.status.replace('_',' ')}</span></td>
        <td>${new Date(c.expira_em).toLocaleDateString('pt-BR')}</td>
        <td class="acoes-tabela">${podeCancelar ? `<button class="perigo" onclick="cancelarConvite('${c.id}')">Cancelar</button>` : ''}</td>
      </tr>`;
    });
    html += '</table>';
    div.innerHTML = html;
  } catch (e) {
    div.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
}

async function cancelarConvite(id) {
  if (!confirm('Cancelar este convite? O link deixará de funcionar.')) return;
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/convites/' + id + '/cancelar', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chaveMestra: CHAVE_MESTRA })
    });
    const dados = await resposta.json();
    if (!resposta.ok) { alert(dados.erro || 'Erro ao cancelar.'); return; }
    carregarConvites();
  } catch (e) {
    alert('Não foi possível conectar à API.');
  }
}

async function carregarLojistas() {
  const div = document.getElementById('listaLojistas');
  div.innerHTML = 'Carregando...';
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/estabelecimentos?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA));
    const dados = await resposta.json();
    if (!resposta.ok) {
      div.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao carregar.') + '</div>';
      return;
    }
    if (dados.length === 0) {
      div.innerHTML = '<p class="sub">Nenhum lojista cadastrado ainda.</p>';
      return;
    }
    let html = '<table><tr><th>Loja</th><th>Status</th><th></th></tr>';
    dados.forEach(l => {
      html += `<tr>
        <td style="cursor:pointer" onclick="abrirDetalheLoja('${l.id}')">${l.nome}<br><span class="sub" style="font-size:11px">${l.slug}</span></td>
        <td><span class="badge ${l.ativo ? 'badge-ativo' : 'badge-bloqueado'}">${l.ativo ? 'Ativo' : 'Bloqueado'}</span></td>
        <td class="acoes-tabela">
          <button class="${l.ativo ? 'perigo' : 'sucesso'}" onclick="alternarStatus('${l.id}', ${!l.ativo})">${l.ativo ? 'Bloquear' : 'Desbloquear'}</button>
        </td>
      </tr>`;
    });
    html += '</table>';
    div.innerHTML = html;
  } catch (e) {
    div.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
}

async function alternarStatus(id, novoAtivo) {
  const acao = novoAtivo ? 'desbloquear' : 'bloquear';
  if (!confirm(`Tem certeza que quer ${acao} esta loja?`)) return;
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/estabelecimentos/' + id + '/status', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chaveMestra: CHAVE_MESTRA, ativo: novoAtivo })
    });
    const dados = await resposta.json();
    if (!resposta.ok) { alert(dados.erro || 'Erro ao atualizar.'); return; }
    carregarLojistas();
  } catch (e) {
    alert('Não foi possível conectar à API.');
  }
}

function preencherCampo(id, valor) {
  document.getElementById(id).value = valor || '';
}

async function abrirDetalheLoja(id) {
  LOJA_DETALHE_ATUAL = id;
  document.getElementById('modalDetalheLoja').classList.remove('oculto');
  document.getElementById('detalheLojaNome').textContent = 'Carregando...';
  document.getElementById('resultadoDetalheLoja').innerHTML = '';
  try {
    const resposta = await fetch(API_BASE_URL + '/painel/estabelecimentos/' + id + '?chaveMestra=' + encodeURIComponent(CHAVE_MESTRA), { cache: 'no-store' });
    const dados = await resposta.json();
    if (!resposta.ok) {
      document.getElementById('detalheLojaNome').textContent = 'Erro';
      document.getElementById('resultadoDetalheLoja').innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao carregar.') + '</div>';
      return;
    }

    document.getElementById('detalheLojaNome').textContent = dados.nome;
    document.getElementById('detalheLojaSlug').textContent = '/' + dados.slug;
    preencherCampo('campoEmail', dados.email);
    preencherCampo('campoWhatsapp', dados.whatsapp);
    preencherCampo('campoTelefone', dados.telefone);
    preencherCampo('campoEndereco', dados.endereco);
    preencherCampo('campoResponsavelNome', [dados.responsavel_nome, dados.responsavel_sobrenome].filter(Boolean).join(' '));
    preencherCampo('campoResponsavelTelefone', dados.responsavel_telefone);
    preencherCampo('campoCpf', dados.cpf);
    preencherCampo('campoCnpj', dados.cnpj);
    preencherCampo('campoRazaoSocial', [dados.razao_social, dados.nome_fantasia].filter(Boolean).join(' / '));
    preencherCampo('campoCep', dados.cep);
    preencherCampo('campoRua', dados.rua);
    preencherCampo('campoNumero', dados.numero);
    preencherCampo('campoBairro', dados.bairro);
    preencherCampo('campoCidade', dados.cidade);
    preencherCampo('campoUf', dados.uf);
  } catch (e) {
    document.getElementById('resultadoDetalheLoja').innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
}

function fecharDetalheLoja() {
  document.getElementById('modalDetalheLoja').classList.add('oculto');
  LOJA_DETALHE_ATUAL = null;
}

async function salvarDetalheLoja() {
  if (!LOJA_DETALHE_ATUAL) return;
  const resultadoDiv = document.getElementById('resultadoDetalheLoja');
  const botao = document.getElementById('btnSalvarDetalheLoja');
  resultadoDiv.innerHTML = '';
  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const corpo = {
    chaveMestra: CHAVE_MESTRA,
    email: document.getElementById('campoEmail').value.trim(),
    whatsapp: document.getElementById('campoWhatsapp').value.trim(),
    telefone: document.getElementById('campoTelefone').value.trim(),
    endereco: document.getElementById('campoEndereco').value.trim(),
    responsavel_telefone: document.getElementById('campoResponsavelTelefone').value.trim(),
    cep: document.getElementById('campoCep').value.trim(),
    rua: document.getElementById('campoRua').value.trim(),
    numero: document.getElementById('campoNumero').value.trim(),
    bairro: document.getElementById('campoBairro').value.trim(),
    cidade: document.getElementById('campoCidade').value.trim(),
    uf: document.getElementById('campoUf').value.trim()
  };

  try {
    const resposta = await fetch(API_BASE_URL + '/painel/estabelecimentos/' + LOJA_DETALHE_ATUAL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    });
    const dados = await resposta.json();
    if (!resposta.ok) {
      resultadoDiv.innerHTML = '<div class="msg erro">' + (dados.erro || 'Erro ao salvar.') + '</div>';
    } else {
      resultadoDiv.innerHTML = '<div class="msg ok">Dados atualizados com sucesso.</div>';
      carregarLojistas();
    }
  } catch (e) {
    resultadoDiv.innerHTML = '<div class="msg erro">Não foi possível conectar à API.</div>';
  }
  botao.disabled = false;
  botao.textContent = 'Salvar alterações';
}
</script>
</body>
</html>
