<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus pedidos - Palatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cliente-auth.css?v=20260729a">
<link rel="stylesheet" href="css/minha-conta.css?v=20260821b">
</head>
<body class="conta-pagina">

  <div id="tela-carregando" class="tela-carregando">
    <div class="spinner"></div>
  </div>

  <div id="tela-cliente" class="conta-shell oculto">

    <svg class="auth-swoosh" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <path d="M400 0 L400 260 C400 150 290 50 120 0 Z" fill="#146c43"/>
      <path d="M138 -18 C310 34 418 142 418 262" stroke="#f3a01c" stroke-width="7" stroke-linecap="round" fill="none"/>
    </svg>

    <div class="conta-topo">
      <button class="conta-link-topo" id="botao-voltar-cardapio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Voltar
      </button>
      <a class="conta-link-topo conta-link-topo--direita" id="link-suporte" href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-8h3ZM3 19a2 2 0 0 0 2 2h1v-8H3Z"/></svg>
        Suporte
      </a>
    </div>

    <div class="conta-cabecalho">
      <p class="conta-saudacao">Olá, <strong id="conta-nome-topo">usuário</strong></p>
      <h1 class="conta-titulo">Meus <strong>pedidos</strong></h1>
    </div>

    <div class="conta-abas">
      <button class="conta-aba" data-aba-cliente="dados">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        Meus dados
      </button>
      <button class="conta-aba" data-aba-cliente="pedidos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        Meus pedidos
      </button>
      <button class="conta-aba" data-aba-cliente="reservas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Minhas reservas
      </button>
      <button class="conta-aba" data-aba-cliente="notificacoes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        Notificações
        <span id="badge-aba-notificacoes" class="badge-notificacao oculto">0</span>
      </button>
    </div>

    <div class="conta-conteudo">
      <div id="resumo-pedidos-cliente" class="conta-resumo oculto"></div>
      <div class="conta-historico-titulo">Histórico de pedidos</div>
      <div id="lista-pedidos-cliente"></div>
    </div>

    <p class="conta-sair-linha">
      <button type="button" id="botao-sair-conta">Sair da conta</button>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/conta-comum.js"></script>
  <script src="js/meus-pedidos.js?v=20260821b"></script>
</body>
</html>
