<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Redirecionando...</title>
</head>
<body>
<script>
(function () {
  // Remove barras no inicio/fim e separa em partes: /nomedaloja/admin -> ["nomedaloja", "admin"]
  var caminho = window.location.pathname.replace(/^\/+|\/+$/g, '');
  var partes = caminho.split('/').filter(Boolean);

  // Se acessou so a raiz (ou algo sem slug), manda pra pagina inicial normal
  if (partes.length === 0) {
    window.location.replace('/index.html');
    return;
  }

  var slug = partes[0];

  // "/blog" e "/blog/algum-post" nao sao lojas -- sao o blog publico do
  // super admin. Trata antes de cair na logica de slug de loja abaixo.
  if (slug === 'blog') {
    var slugPost = partes[1];
    var paramsBlog = new URLSearchParams(window.location.search);
    var destinoBlog;
    if (slugPost === 'sobre-nos' || slugPost === 'contato') {
      paramsBlog.set('tipo', slugPost);
      destinoBlog = '/frontend/blog/pagina.html?' + paramsBlog.toString();
    } else if (slugPost) {
      paramsBlog.set('slug', slugPost);
      destinoBlog = '/frontend/blog/post.html?' + paramsBlog.toString();
    } else {
      destinoBlog = '/frontend/blog/index.html' + (paramsBlog.toString() ? '?' + paramsBlog.toString() : '');
    }
    window.location.replace(destinoBlog);
    return;
  }

  var ehAdmin = partes[1] === 'admin';

  var paramsFinal = new URLSearchParams(window.location.search);
  paramsFinal.set('slug', slug);

  var destino = (ehAdmin ? '/frontend/admin/index.html' : '/frontend/index.html') + '?' + paramsFinal.toString();

  window.location.replace(destino);
})();
</script>
<p>Redirecionando...</p>
</body>
</html>
