<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Política de Privacidade — Palatos</title>
<style>
  :root{
    --bg: #FBF9F6;
    --ink: #201C18;
    --ink-soft: #5A5248;
    --accent: #A8471E;
    --line: #E4DDD2;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    line-height:1.65;
    text-align: left !important;
  }
  header{
    padding:48px 24px 32px;
    max-width:760px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
    text-align: left !important;
  }
  header .brand{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--accent);
    margin-bottom:12px;
  }
  h1{
    font-size:32px;
    margin:0 0 8px;
    font-weight:400;
    text-align: left !important;
  }
  .updated{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:40px 24px 80px;
    text-align: left !important;
  }
  h2, h3{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--accent);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin: 30px 0 14px;
    text-align: left !important;
  }
  p, li{
    font-size:16px;
    color:var(--ink);
    text-align: left !important;
  }
  ul{padding-left:20px; margin: 0 0 16px;}
  li{margin-bottom:8px;}
  a{color:var(--accent);}
  img.imagem-inline{ width:100%; border-radius:8px; margin: 20px 0; display:block; }
  footer{
    max-width:760px;
    margin:0 auto;
    padding:24px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  footer a{color:var(--ink-soft);}
  .carregando{ text-align:center; padding: 60px 24px; color: var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="brand">Palatos</div>
  <h1 id="tituloPagina">Política de Privacidade</h1>
  <div class="updated" id="dataAtualizacao"></div>
</header>

<main>
  <div id="conteudoPagina" class="carregando">Carregando...</div>
</main>

<footer>
  Palatos — uma plataforma ConectTec · <a href="https://palatos.com.br">palatos.com.br</a>
</footer>

<script src="frontend/js/config.js"></script>
<script>
function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}
function formatarInline(texto) {
  return escaparHtml(texto).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function renderizarConteudo(texto) {
  const blocos = (texto || '').split(/\n\s*\n/);
  return blocos.map(bloco => {
    const linha = bloco.trim();
    if (!linha) return '';
    if (linha.startsWith('## ')) return `<h2>${formatarInline(linha.slice(3).trim())}</h2>`;
    const imagem = linha.match(/^!\[([^\]]*)\]\((\S+)\)$/);
    if (imagem) return `<img class="imagem-inline" src="${escaparHtml(imagem[2])}" alt="${escaparHtml(imagem[1])}">`;
    const linhasDoBloco = linha.split('\n').map(l => l.trim()).filter(Boolean);
    if (linhasDoBloco.length > 0 && linhasDoBloco.every(l => l.startsWith('- '))) {
      return `<ul>${linhasDoBloco.map(l => `<li>${formatarInline(l.slice(2).trim())}</li>`).join('')}</ul>`;
    }
    return `<p>${formatarInline(linha).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

async function carregar() {
  const div = document.getElementById('conteudoPagina');
  try {
    const resposta = await fetch(API_BASE_URL + '/blog/paginas/politica-privacidade');
    const pagina = await resposta.json();
    if (!resposta.ok) {
      div.innerHTML = '<p>Esta página ainda não foi preenchida.</p>';
      return;
    }
    document.getElementById('tituloPagina').textContent = pagina.titulo || 'Política de Privacidade';
    document.title = (pagina.titulo || 'Política de Privacidade') + ' — Palatos';
    if (pagina.atualizado_em) {
      document.getElementById('dataAtualizacao').textContent =
        'Última atualização: ' + new Date(pagina.atualizado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
    }
    div.innerHTML = renderizarConteudo(pagina.conteudo);
  } catch (e) {
    div.innerHTML = '<p>Não foi possível carregar esta página agora. Tente novamente em instantes.</p>';
  }
}
carregar();
</script>
</body>
</html>
